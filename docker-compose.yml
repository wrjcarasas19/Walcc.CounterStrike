services:
  cs16-web-server:
    # The build context is the repository: the image takes every app in apps/.
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: cs16-web-server
    command: ["+map de_dust2", "+maxplayers 14"]
    restart: always
    platform: linux/amd64
    environment:
      IP: 127.0.0.1
      PORT: 27018
      # Set in .env (ignored by git); see .env.example. The F4 menu logs in
      # with ADMIN_PASSWORD; without it, it falls back to RCON_PASSWORD.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      # Players (humans + bots) to keep in the game; 0 = no bots.
      BOT_QUOTA: ${BOT_QUOTA:-0}
      # 1 = list bots on /leaderboard too.
      LEADERBOARD_BOTS: ${LEADERBOARD_BOTS:-0}
    volumes:
      # The ban list (bans.json) and the leaderboard (leaderboard.db), kept
      # across restarts and image updates.
      - /var/data/cs:/xashds/data
    ports:
      - "27016:27016"
      - "27018:27018/tcp"
      - "27018:27018/udp"
    networks:
      proxy:
        aliases: [cs]
    labels:
      project: cs
      app: server

  # Half-Life deathmatch for players on this network, from the same image.
  # Started only with `docker compose --profile hl up -d`; the deploy
  # workflow keeps it on the VPS, stopped, on Counter-Strike's ports and
  # public IP (one runs at a time). Players open http://<LAN_IP>:27026.
  hl-web-server:
    profiles: [hl]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: hl-web-server
    entrypoint: ["./xash", "+ip", "0.0.0.0", "-port", "27015", "-game", "valve"]
    command: ["+map crossfire", "+maxplayers 16"]
    restart: always
    platform: linux/amd64
    environment:
      # The address other machines reach this one at (set in .env); WebRTC
      # is advertised there.
      IP: ${LAN_IP:-127.0.0.1}
      PORT: 27028
    volumes:
      # The ban list (bans.json).
      - hl-data:/xashds/data
    ports:
      - "27026:27016"
      - "27028:27028/tcp"
      - "27028:27028/udp"
    labels:
      project: cs
      app: hl-server

volumes:
  hl-data:

networks:
  proxy:
    name: proxy
    external: true