// Half-Life deathmatch (the hl-web-server compose service, -game valve).
// The Counter-Strike server never runs this folder's configs; it runs
// cstrike/server.cfg. Players come from the command line (+maxplayers).

hostname "Half-Life Deathmatch"
mp_timelimit 15
mp_fraglimit 30
mp_weaponstay 1
mp_forcerespawn 1

// No voice chat: the server doesn't relay voice data.
sv_voiceenable 0

// Same as cstrike/server.cfg: file fragment sends (sprays, missing
// resources) crash Netchan_TransmitBits, and the browser loads every map
// from the game-files zip.
sv_allowdownload 0
sv_allowupload 0
sv_send_logos 0
sv_send_resources 1

// Fewer server frames, less CPU (Xash3D's default is 100).
sys_ticrate 80
