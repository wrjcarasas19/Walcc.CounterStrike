;
; YaPB 4.4 difficulty levels (yb_difficulty 0-4), replacing the one in YaPB's
; release (copied over it by apps/server/Dockerfile). Read by YaPB's
; BotConfig::loadDifficultyConfig; a line with other than 9 values is ignored.
;
; Level = minReactionTime(s), maxReactionTime(s), headshotProbability,
;         seenThruWallChance, heardThruWallChance, maxWeaponRecoil,
;         aimError x, y, z
;
; Changed from YaPB's file (its values in brackets) so the lower levels play
; easy:
; - Easy (1): reaction 0.7-0.9 s [0.6-0.8], recoil 34 [32], aim error
;   20, 20, 30 [15, 15, 24], heard-through-wall chance 0 [10].
; - Normal (2, the image's default): reaction 0.5-0.7 s [0.4-0.6],
;   headshots 30 [50], recoil 30 [26], aim error 10, 10, 16 [5, 5, 10],
;   through-wall chances 0 and 0 [30 and 40].
; Hard (3) and Expert (4) are YaPB's: Survival's late waves and co-op's
; adaptive difficulty climb to them (apps/amxx/wc_gm_waves.inc,
; wc_gm_coop.inc). Through-wall attacks are also off for every level while
; yb_shoots_thru_walls is 0 (set in the Dockerfile); the two chances only
; count if it's turned back on, and YaPB never uses them below Normal.
;

Noob = 0.8, 1.0, 5, 0, 0, 38, 30.0, 30.0, 40.0
Easy = 0.7, 0.9, 10, 0, 0, 34, 20.0, 20.0, 30.0
Normal = 0.5, 0.7, 30, 0, 0, 30, 10.0, 10.0, 16.0
Hard = 0.2, 0.4, 75, 60, 70, 23, 0.0, 0.0, 0.0
Expert = 0.1, 0.2, 100, 90, 90, 21, 0.0, 0.0, 0.0
