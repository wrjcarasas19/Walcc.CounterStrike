<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Counter-Strike 1.6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="desktop" data-phase="idle">
      <form id="launcher" class="launcher" novalidate>
        <header class="launcher-header">
          <h1 class="launcher-title">CS <span>1.6</span></h1>
          <div class="launcher-subtitle">Client Launcher</div>
        </header>

        <div class="launcher-body">
          <div class="field">
            <label class="field-label" for="nickname-input">Nickname</label>
            <input
              id="nickname-input"
              class="field-input"
              type="text"
              placeholder="Enter nickname"
              autocomplete="nickname"
              maxlength="31"
              autofocus
            />
          </div>

          <section id="download-section" class="progress-section">
            <div class="progress-heading">
              <span class="field-label">Downloading files</span>
              <span id="download-percent" class="progress-percent">0%</span>
            </div>
            <div class="progress-track">
              <div id="download-bar" class="progress-fill"></div>
            </div>
            <div id="download-status" class="progress-status"></div>
          </section>

          <section id="load-section" class="progress-section">
            <div class="progress-heading">
              <span class="field-label">Loading files</span>
              <span id="load-percent" class="progress-percent">0%</span>
            </div>
            <div class="progress-track">
              <div id="load-bar" class="progress-fill"></div>
            </div>
            <div id="load-status" class="progress-status"></div>
          </section>

          <div
            id="connect-status"
            class="progress-status connect-status"
            role="status"
          ></div>

          <button
            id="action-button"
            class="action-button"
            type="submit"
            disabled
          >
            Download
          </button>
        </div>
      </form>
    </div>
    <div id="game">
      <canvas id="canvas"></canvas>
      <div id="hud" data-alive="unknown" hidden>
        <div id="hud-killfeed" class="hud-killfeed"></div>

        <div class="hud-vitals">
          <div id="hud-health" class="hud-panel hud-stat" hidden>
            <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" />
            </svg>
            <span id="hud-health-value" class="hud-value"></span>
          </div>
          <div id="hud-armor" class="hud-panel hud-stat" hidden>
            <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2l9 3.5v6c0 5.3-3.8 9.6-9 10.5-5.2-.9-9-5.2-9-10.5v-6z" />
            </svg>
            <span id="hud-armor-value" class="hud-value"></span>
            <span id="hud-helmet" class="hud-tag" hidden>Helmet</span>
          </div>
        </div>

        <div id="hud-timer" class="hud-panel hud-timer" hidden>
          <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 1h6v2h-2v1.1A9 9 0 1 1 11 4.1V3H9zm3 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm-1 2h2v5h-2z"
            />
          </svg>
          <span id="hud-timer-value" class="hud-value"></span>
          <span class="hud-bomb">Bomb planted</span>
        </div>

        <div class="hud-loadout">
          <div id="hud-money" class="hud-panel hud-money" hidden>
            <span id="hud-money-delta" class="hud-money-delta"></span>
            <span class="hud-money-sign">$</span>
            <span id="hud-money-value" class="hud-value"></span>
          </div>
          <div id="hud-ammo" class="hud-panel hud-ammo" hidden>
            <span id="hud-weapon" class="hud-weapon"></span>
            <span id="hud-clip" class="hud-value"></span>
            <span id="hud-reserve" class="hud-reserve"></span>
          </div>
        </div>

        <div id="hud-scoreboard" class="hud-scoreboard" hidden>
          <header class="sb-header">
            <span class="sb-title">Scoreboard</span>
            <span id="sb-server" class="sb-server"></span>
            <span id="sb-map" class="sb-map"></span>
          </header>
          <div class="sb-teams">
            <section class="sb-team ct">
              <div class="sb-team-head">
                <span class="sb-team-name">Counter-Terrorists</span>
                <span id="sb-ct-meta" class="sb-team-meta"></span>
                <span id="sb-ct-score" class="sb-team-score"></span>
              </div>
              <div class="sb-row sb-labels">
                <span></span><span>Name</span><span>K</span><span>D</span
                ><span>Ping</span>
              </div>
              <div id="sb-ct-rows" class="sb-rows"></div>
            </section>
            <section class="sb-team t">
              <div class="sb-team-head">
                <span class="sb-team-name">Terrorists</span>
                <span id="sb-t-meta" class="sb-team-meta"></span>
                <span id="sb-t-score" class="sb-team-score"></span>
              </div>
              <div class="sb-row sb-labels">
                <span></span><span>Name</span><span>K</span><span>D</span
                ><span>Ping</span>
              </div>
              <div id="sb-t-rows" class="sb-rows"></div>
            </section>
          </div>
          <div id="sb-spectators" class="sb-spectators" hidden>
            <span class="sb-spectators-label">Spectators</span>
            <span id="sb-spectator-names" class="sb-spectator-names"></span>
          </div>
        </div>
      </div>
      <div id="admin-menu" class="admin-backdrop" hidden>
        <form
          id="admin-form"
          class="admin-panel"
          role="dialog"
          aria-labelledby="admin-title"
          novalidate
        >
          <header class="admin-header">
            <span id="admin-title" class="admin-title">Change map</span>
            <span class="admin-hint">F4 / Esc to close</span>
          </header>
          <div class="admin-body">
            <div class="field">
              <label class="field-label" for="admin-password">
                Rcon password
              </label>
              <input
                id="admin-password"
                class="field-input"
                type="password"
                autocomplete="off"
                maxlength="64"
              />
            </div>
            <div class="field">
              <span class="field-label" id="admin-maps-label">Map</span>
              <div
                id="admin-maps"
                class="admin-maps"
                role="radiogroup"
                aria-labelledby="admin-maps-label"
              ></div>
            </div>
            <div id="admin-status" class="progress-status" role="status"></div>
            <button
              id="admin-submit"
              class="action-button"
              type="submit"
              disabled
            >
              Change map
            </button>
          </div>
        </form>
      </div>
      <div id="connection-lost" class="overlay" role="alertdialog" hidden>
        <div class="overlay-panel">
          <div id="connection-message" class="overlay-message">
            Connection to the server was lost
          </div>
          <button id="reload-button" class="action-button" type="button">
            Reload
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
