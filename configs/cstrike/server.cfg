hostname "My CS 1.6 Web Server"
sv_lan 0
public 0
mp_friendlyfire 1
mp_timelimit 30
mp_autoteambalance 1

// File fragment sends (sprays / missing resources) crash Netchan_TransmitBits.
sv_allowdownload 0
sv_allowupload 0
sv_send_logos 0
sv_send_resources 1

// Network rates. Set here because the server runs with -game cstrike, so
// valve/default.cfg is not guaranteed to run.
sv_minrate 5000
sv_maxrate 100000
sv_minupdaterate 30
sv_maxupdaterate 101
