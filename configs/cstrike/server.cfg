hostname "My CS 1.6 Web Server"
sv_lan 0
public 0
mp_friendlyfire 1
mp_timelimit 30
mp_autoteambalance 1

// Voice chat: teammates only, the living don't hear the dead (the CS 1.6
// rules, src/server/voice_roster.go). Xash3D's own default is 1 (everyone
// hears everyone). The F4 Match tab can turn it on.
sv_alltalk 0

// File fragment sends (sprays / missing resources) crash Netchan_TransmitBits.
sv_allowdownload 0
sv_allowupload 0
sv_send_logos 0
sv_send_resources 1

// Network rates. Set here because the server runs with -game cstrike, so
// valve/default.cfg is not guaranteed to run.
sv_minrate 5000
sv_maxrate 100000
sv_minupdaterate 30
sv_maxupdaterate 101
