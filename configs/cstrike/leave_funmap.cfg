// Run by the engine when the map after a fy_, aim_ or awp_ map starts
// (mapchangecfgfile, set by addons/amxmodx/configs/maps/prefix_*.cfg). Puts
// back the stock values those configs changed, so a classic map doesn't keep
// $16000 and 2-minute rounds.
mp_startmoney 800
mp_freezetime 6
mp_roundtime 5
mp_buytime 1.5
mapchangecfgfile ""
