// Every awp_ map (AMX Mod X runs maps/prefix_<prefix>.cfg about 6 seconds
// after the map loads). Overrides what the F4 Match tab set; keep the values
// in step with FUN_MAP_* in src/client/src/admin/map.ts.
mp_startmoney 16000
mp_freezetime 0
mp_roundtime 2
mp_buytime 0.25
// The engine runs this at the start of the next map, which puts the stock
// values back (a fun map next sets them again here).
mapchangecfgfile leave_funmap.cfg
// Players and bots who joined in the first seconds got the old values.
sv_restart 1
